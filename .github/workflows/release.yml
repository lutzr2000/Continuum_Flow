name: Build releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-releases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: windows-blender50
          output_name: "blender5.0-windows-x64"
          python: "3.11"
          abi: "cp311"
          platform: "win_amd64"
          blender_platform: "windows-x64"
          blender_min: "5.0.0"
          blender_max: "5.1.0"
          requirements: "requirements/windows.txt"
          blender_version: "5.0.1"

        - name: linux-blender50
          output_name: "blender5.0-linux-x64"
          python: "3.11"
          abi: "cp311"
          blender_platform: "linux-x64"
          blender_min: "5.0.0"
          blender_max: "5.1.0"
          requirements: "requirements/linux.txt"
          blender_version: "5.0.1"

        - name: macos-blender50
          output_name: "blender5.0-macos-arm64"
          python: "3.11"
          abi: "cp311"
          platform: "macosx_12_0_arm64"
          blender_platform: "macos-arm64"
          blender_min: "5.0.0"
          blender_max: "5.1.0"
          requirements: "requirements/macos.txt"
          blender_version: "5.0.1"

        - name: windows-blender51
          output_name: "blender5.1plus-windows-x64"
          python: "3.13"
          abi: "cp313"
          platform: "win_amd64"
          blender_platform: "windows-x64"
          blender_min: "5.1.0"
          blender_max: ""
          requirements: "requirements/windows.txt"
          blender_version: "5.1.0"

        - name: linux-blender51
          output_name: "blender5.1plus-linux-x64"
          python: "3.13"
          abi: "cp313"
          blender_platform: "linux-x64"
          blender_min: "5.1.0"
          blender_max: ""
          requirements: "requirements/linux.txt"
          blender_version: "5.1.0"

        - name: macos-blender51
          output_name: "blender5.1plus-macos-arm64"
          python: "3.13"
          abi: "cp313"
          platform: "macosx_12_0_arm64"
          blender_platform: "macos-arm64"
          blender_min: "5.1.0"
          blender_max: ""
          requirements: "requirements/macos.txt"
          blender_version: "5.1.0"

    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Create wheels directory
        run: mkdir -p wheels

      - name: Download wheels
        run: |
          if [[ "${{ matrix.name }}" == linux-* ]]; then
            python -m pip download \
              -r "${{ matrix.requirements }}" \
              --dest wheels \
              --only-binary=:all: \
              --python-version="${{ matrix.python }}" \
              --implementation=cp \
              --abi="${{ matrix.abi }}"
          else
            python -m pip download \
              -r "${{ matrix.requirements }}" \
              --dest wheels \
              --only-binary=:all: \
              --python-version="${{ matrix.python }}" \
              --implementation=cp \
              --abi="${{ matrix.abi }}" \
              --platform="${{ matrix.platform }}"
          fi

      - name: Show downloaded wheels
        run: |
          echo "Downloaded wheels for ${{ matrix.name }}:"
          ls -lh wheels

      - name: Generate Blender manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("blender_manifest.toml")

          wheels = sorted(Path("wheels").glob("*.whl"))

          wheel_lines = ",\n".join(
              f'    "./{wheel.as_posix()}"'
              for wheel in wheels
          )

          blender_min = "${{ matrix.blender_min }}"
          blender_max = "${{ matrix.blender_max }}"
          blender_platform = "${{ matrix.blender_platform }}"

          content = f'''schema_version = "1.0.0"

          id = "continuum_flow"
          version = "${{ inputs.version }}"
          name = "Continuum Flow"
          tagline = "Smoke and fire simulator"
          maintainer = "Lutz Rohlfing"
          type = "add-on"

          website = "https://lutzr2000.github.io/Continuum_Flow/"
          tags = ["Physics"]

          blender_version_min = "{blender_min}"
          '''

          if blender_max:
              content += f'blender_version_max = "{blender_max}"\n'

          content += f'''
          platforms = ["{blender_platform}"]

          license = [
              "SPDX:GPL-3.0-or-later",
          ]

          wheels = [
          {wheel_lines}
          ]

          [permissions]
          files = "Read and write simulation cache files"
          '''

          # Entfernt die Einrückung des YAML-Python-Blocks.
          import textwrap
          manifest.write_text(
              textwrap.dedent(content),
              encoding="utf-8"
          )

          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: Show generated manifest
        run: |
          echo "Generated manifest:"
          cat blender_manifest.toml

      - name: Download Blender
        run: |
          BLENDER_VERSION="${{ matrix.blender_version }}"
          BLENDER_MAJOR_MINOR="${BLENDER_VERSION%.*}"

          wget -q \
            "https://download.blender.org/release/Blender${BLENDER_MAJOR_MINOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -O blender.tar.xz

          tar -xf blender.tar.xz

          echo "BLENDER_PATH=$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Check Blender version
        run: |
          "$BLENDER_PATH" --version

      - name: Build Blender extension
        run: |
          mkdir -p dist

          "$BLENDER_PATH" --command extension build \
            --source-dir . \
            --output-dir dist

      - name: Rename build
        run: |
          BUILT_ZIP=$(find dist -maxdepth 1 -name "*.zip" | head -n 1)
          TARGET_NAME="continuum_flow-${{ inputs.version }}-${{ matrix.output_name }}.zip"

          mv "$BUILT_ZIP" "dist/$TARGET_NAME"

          echo "Renamed build to:"
          echo "$TARGET_NAME"

      - name: Show build result
        run: |
          echo "Built files:"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: continuum-flow-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  create-release:
    needs: build-releases
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: continuum-flow-*
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            release-files/*.zip \
            --target "${{ github.sha }}" \
            --title "Continuum Flow ${{ inputs.version }} Alpha" \
            --generate-notes \
            --prerelease